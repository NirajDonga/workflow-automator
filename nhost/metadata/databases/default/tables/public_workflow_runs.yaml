table:
  schema: public
  name: workflow_runs
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: triggered_by_user
    using:
      foreign_key_constraint_on: triggered_by
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: run_id
        table:
          schema: public
          name: step_runs
select_permissions:
  - role: user
    permission:
      columns: [id, workflow_id, triggered_by, trigger_type, status, started_at, completed_at, created_at]
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
