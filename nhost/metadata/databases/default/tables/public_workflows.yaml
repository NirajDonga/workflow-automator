table:
  schema: public
  name: workflows
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: workflow_steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_steps
  - name: workflow_triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_triggers
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_runs
select_permissions:
  - role: user
    permission:
      columns: [id, org_id, name, created_at]
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      columns: [org_id, name]
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _in: [owner, editor]
update_permissions:
  - role: user
    permission:
      columns: [name]
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _in: [owner, editor]
delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
