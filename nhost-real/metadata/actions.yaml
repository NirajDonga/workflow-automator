actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "{{NHOST_BACKEND_URL}}/v1/functions/trigger-workflow-run"
      forward_client_headers: true
    permissions:
      - role: user
  - name: approveStep
    definition:
      kind: synchronous
      handler: "{{NHOST_BACKEND_URL}}/v1/functions/approve-step"
      forward_client_headers: true
    permissions:
      - role: user
  - name: webhookTrigger
    definition:
      kind: synchronous
      handler: "{{NHOST_BACKEND_URL}}/v1/functions/webhook-trigger"
      forward_client_headers: true
    permissions:
      - role: user
custom_types:
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
    - name: ApproveStepOutput
    - name: WebhookTriggerOutput
