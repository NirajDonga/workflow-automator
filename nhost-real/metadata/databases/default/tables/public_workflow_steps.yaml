table:
  schema: public
  name: workflow_steps
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: step_id
        table:
          schema: public
          name: step_runs
select_permissions:
  - role: user
    permission:
      columns: [id, workflow_id, step_type, config, order_index, created_at]
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      columns: [workflow_id, step_type, config, order_index]
      check:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _in: [owner, editor]
update_permissions:
  - role: user
    permission:
      columns: [step_type, config, order_index]
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _in: [owner, editor]
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _eq: owner
