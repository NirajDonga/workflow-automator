table:
  schema: public
  name: org_monthly_usage
object_relationships:
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: public
          name: organizations
        column_mapping:
          org_id: id
select_permissions:
  - role: user
    permission:
      columns: [org_id, runs_this_month, avg_duration_s]
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
